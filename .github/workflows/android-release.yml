name: Android Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Each build gets a higher versionCode so a new APK installs over the old one.
      # Offset keeps release builds above the fast builds from the other workflow.
      - run: node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('app.json'));c.expo.android.versionCode=100000+Number(process.env.GITHUB_RUN_NUMBER);fs.writeFileSync('app.json',JSON.stringify(c,null,2))"
      - run: npx expo prebuild --platform android --no-install
      # All ABIs, so it runs on any Android phone.
      # shortcut: release APK is signed with the Expo template's debug key; add a release keystore from secrets before Play Store.
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v7
        with:
          name: foster-memories-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
      - if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "foster-memories-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" "foster-memories-${GITHUB_REF_NAME}.apk" --generate-notes
